name: Validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo check --all-features
      - run: cargo test --all-features
      - run: cargo clippy --all-features -- -D warnings
      - run: cargo build --release --all-features
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm audit --audit-level=low
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings
      - run: npm run tauri:build -- --debug --bundles app
        working-directory: desktop

  core-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --no-default-features -- -D warnings

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit --file Cargo.lock
      - run: cargo audit --file desktop/src-tauri/Cargo.lock
