[package]
name = "easycontrol"
version = "0.1.0"
edition = "2021"
description = "Free, fast remote desktop tool in Rust"
authors = ["easycontrol"]
license = "MIT"
repository = "https://github.com/udhaybhat00/easycontrol"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rand = "0.8"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
spake2 = "0.4"
base64 = "0.22"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
xcap = { version = "0.9.8", optional = true }
enigo = { version = "0.6.1", optional = true }
zstd = { version = "0.13", optional = true }
x25519-dalek = { version = "1.1", optional = true }
getrandom = "0.2"
arboard = "3.4"
cap-std = "3"
ambient-authority = "0.0.2"

[features]
default = ["crypto"]
capture = ["xcap"]
input = ["enigo"]
compression = ["zstd"]
crypto = ["x25519-dalek"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
