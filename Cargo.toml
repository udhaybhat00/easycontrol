[package]
name = "easycontrol"
version = "0.1.0"
edition = "2021"
description = "Free, fast remote desktop tool in Rust"
authors = ["easycontrol"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rand = "0.8"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
xcap = { version = "0.9.8", optional = true }

[features]
default = []
capture = ["xcap"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
